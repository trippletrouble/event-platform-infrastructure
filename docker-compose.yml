services:
  test-postgres:
    image: postgres:13.5
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - test-events
    volumes:
      - test-postgres:/var/lib/postgresql/data
    profiles:
      - 'db-standalone'
      - ''


  test-nestjs:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${POSTGRES_URL}
    #extra_hosts:
    #  - "auth.ocaens.de:host-gateway"
    volumes:
      - test-uploads:/app/uploads
    ports:
      - '${BACKEND_PORT}:3100'
    networks:
      - test-events
    depends_on:
      test-postgres:
        condition: service_healthy

    profiles:
      - 'backend-standalone'
      - ''

  test-prism:
    image: stoplight/prism:4
    command: mock /tmp/swagger.yml --host 0.0.0.0 --port 4010
    volumes:
      - ./backend/docs/swagger.yml:/tmp/swagger.yml
    ports:
      - '4010:4010'
    networks:
      - test-events
    profiles:
      - 'mock'

  test-nextjs:
    build: ./frontend
    ports:
      - '${FRONTEND_PORT}:3000'
    networks:
      - test-events
    profiles:
      - 'frontend-standalone'
      - ''

  test-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    networks:
      - test-events
    volumes:
      - test-minio:/data
    profiles:
      - 'minio-standalone'
      - ''

networks:
  test-events:
    driver: bridge
volumes:
  test-uploads:
  test-postgres:
  test-minio:

services:
  postgres:
    image: postgres:13.5
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d event_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - events
    volumes:
      - postgres:/var/lib/postgresql/data
    profiles:
      - 'db-standalone'
      - ''


  nestjs:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${POSTGRES_URL}
    volumes:
      - uploads:/app/uploads
    ports:
      - '${BACKEND_PORT}:3100'
    networks:
      - events
    depends_on:
      postgres:
        condition: service_healthy

    profiles:
      - 'backend-standalone'
      - ''

  prism:
    image: stoplight/prism:4
    command: mock /tmp/swagger.yml --host 0.0.0.0 --port 4010
    volumes:
      - ./backend/docs/swagger.yml:/tmp/swagger.yml
    ports:
      - '4010:4010'
    networks:
      - events
    profiles:
      - 'mock'
      - ''

  nextjs:
    build: ./frontend
    ports:
      - '${FRONTEND_PORT}:3000'
    networks:
      - events
    profiles:
      - 'frontend-standalone'
      - ''

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=***ENTFERNT***
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes
    networks:
      - events
    depends_on:
      postgres:
        condition: service_healthy

networks:
  events:
    driver: bridge
volumes:
  uploads:
  postgres:
services:
  postgres:
    image: postgres:13.5
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d event_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - events
    volumes:
      - postgres:/var/lib/postgresql/data
    profiles:
      - 'db-standalone'
      - ''


  nestjs:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${POSTGRES_URL}
    volumes:
      - uploads:/app/uploads
    ports:
      - '${BACKEND_PORT}:3100'
    networks:
      - events
    depends_on:
      postgres:
        condition: service_healthy

    profiles:
      - 'backend-standalone'
      - ''

  prism:
    image: stoplight/prism:4
    command: mock /tmp/swagger.yml --host 0.0.0.0 --port 4010
    volumes:
      - ./backend/docs/swagger.yml:/tmp/swagger.yml
    ports:
      - '4010:4010'
    networks:
      - events
    profiles:
      - 'mock'

  nextjs:
    image: node:24-alpine
    env_file:
      - ./frontend/.env
    build: ./frontend
    ports:
      - '${FRONTEND_PORT}:3000'
    networks:
      - events
    profiles:
      - 'frontend-standalone'
      - ''

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${MINIO_PORT}:9000'
      - '9001:9001'
    networks:
      - events
    volumes:
      - minio:/data
    profiles:
      - 'minio-standalone'
      - ''

networks:
  events:
    driver: bridge
volumes:
  uploads:
  postgres:
  minio:
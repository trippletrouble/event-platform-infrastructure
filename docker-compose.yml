services:
  postgres:
    image: postgres:13.5
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d event_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - events
    volumes:
      - postgres:/var/lib/postgresql/data
    profiles:
      - ''

  nestjs:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${POSTGRES_URL}
    ports:
      - '${BACKEND_PORT}:3100'
    networks:
      - events
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - ''

  prism:
    image: stoplight/prism:4
    command: mock /tmp/swagger.yml --host 0.0.0.0 --port 4010
    volumes:
      - ./backend/docs/swagger.yml:/tmp/swagger.yml
    ports:
      - '4010:4010'
    networks:
      - events
    profiles:
      - 'mock'

  nextjs:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - '${FRONTEND_PORT}:3000'
    networks:
      - events
    profiles:
      - ''

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${MINIO_PORT:-9100}:9000'
      - '9001:9001'
    networks:
      - events
    volumes:
      - minio:/data
    profiles:
      - ''

  image-service:
    build:
      context: ./image-service
      dockerfile: Dockerfile
    environment:
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-}
      - MINIO_PUBLIC_PORT=${MINIO_PUBLIC_PORT:-443}
      - MINIO_PUBLIC_USE_SSL=${MINIO_PUBLIC_USE_SSL:-true}
      - MINIO_ENDPOINT=dev-minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-mino}
      - IMAGE_SERVICE_PORT=${IMAGE_SERVICE_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:3200/images/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${IMAGE_SERVICE_PORT:-3200}:3200'
    networks:
      - events
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - ''

networks:
  events:
    driver: bridge
volumes:
  uploads:
  postgres:
  minio:
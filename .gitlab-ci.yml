stages:
  - build
  - test
  - deploy

variables:
  npm_config_proxy: http://proxy.hof-university.de:3128
  npm_config_https_proxy: http://proxy.hof-university.de:3128

# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────

backend-build:
  stage: build
  image: node:latest
  rules:
    - changes:
        - backend/**/*
  script:
    - cd backend
    - npm ci
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 hour

backend-test:
  stage: test
  image: node:latest
  rules:
    - changes:
        - backend/**/*
  dependencies:
    - backend-build
  script:
    - cd backend
    - npm run test:ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - backend/coverage/
    when: always
    reports:
      junit:
        - backend/junit.xml

# ──────────────────────────────────────────────
# Frontend
# ──────────────────────────────────────────────

frontend-build:
  stage: build
  image: node:latest
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
  artifacts:
    paths:
      - frontend/node_modules/
      - frontend/.next/
    expire_in: 1 hour

frontend-test:
  stage: test
  allow_failure: true
  image: node:latest
  rules:
    - changes:
        - frontend/**/*
  dependencies:
    - frontend-build
  script:
    - cd frontend
    - npm run test:ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - frontend/coverage/
    when: always
    reports:
      junit:
        - frontend/junit.xml

# ──────────────────────────────────────────────
# Deploy
# ──────────────────────────────────────────────

deploy:
  stage: deploy
  needs:
    - job: backend-test
      optional: true
    - job: frontend-test
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
  tags:
    - shell
  script:
    - cd /path/to/your/project
    - git pull origin $CI_COMMIT_BRANCH
    - docker compose down
    - docker compose build --no-cache
    - docker compose up -d
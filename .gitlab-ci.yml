stages:
  - build
  - test

# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────

backend-build:
  stage: build
  image: node:latest
  artifacts:
    untracked: true
  script:
    - cd backend
    - ls -la
    - npm ci
  #only:
  #  - main
  #  - dev

backend-unit-test:
  stage: test
  image: node:latest
  dependencies:
    - backend-build
  script:
    - ls -la
    - cd backend
    - npm run test:ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - backend/coverage/
    when: always
    reports:
      junit:
        - backend/junit.xml

# ──────────────────────────────────────────────
# Frontend
# ──────────────────────────────────────────────

frontend-build:
  stage: build
  image: node:latest
  script:
    - ls -la
    - cd frontend
    - ls -la
    - npm ci
  artifacts:
    untracked: true

frontend-unit-test:
  stage: test
  image: node:latest
  dependencies:
    - frontend-build
  script:
    - cd frontend
    - npm run test:ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - frontend/coverage/
    when: always
    reports:
      junit:
        - frontend/junit.xml
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

stages:
  - build
  - test
  - deploy

# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────

backend-build:
  stage: build
  image: node:20-alpine
  artifacts:
    untracked: true
  script:
    - cd backend
    - npm ci
  #only:
  #  - main
  #  - dev

backend-unit-test:
  stage: test
  image: node:20-alpine
  dependencies:
    - backend-build
  variables:
    POSTGRES_URL: "postgresql://localhost:5432/placeholder"
    NODE_ENV: "test"
    PORT: "3000"
    FRONTEND_URL: "http://localhost:3000"
    OIDC_ISSUER: "placeholder"
    OIDC_CLIENT_ID: "placeholder"
    OIDC_CLIENT_SECRET: ***ENTFERNT***
    OIDC_CALLBACK_URL: "placeholder"
    JWT_SECRET: ***ENTFERNT***
    JWT_EXPIRATION: "1h"
  script:
    - cd backend
    - npm ci
    - npx prisma generate
    - npm run test:ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - backend/coverage/
    when: always
    reports:
      junit:
        - backend/junit.xml

# ──────────────────────────────────────────────
# Frontend
# ──────────────────────────────────────────────

frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
  artifacts:
    untracked: true

frontend-unit-test:
  stage: test
  image: node:20-alpine
  allow_failure: true
  dependencies:
    - frontend-build
  script:
    - cd frontend
    - npm ci
    - npm run test:ci
    - npx jest src/__tests__/contrast.test.ts
    - npx jest src/__tests__/a11y.test.tsx
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - frontend/coverage/
    when: always
    reports:
      junit:
        - frontend/junit.xml

frontend-lint:
  stage: test
  image: node:20-alpine
  allow_failure: true
  dependencies:
    - frontend-build
  script:
    - cd frontend
    - npm ci
    - ./node_modules/.bin/eslint . --max-warnings 0
    - ./node_modules/.bin/tsc --noEmit

# ──────────────────────────────────────────────
# Deployment (CD)
# ──────────────────────────────────────────────

.deploy_template: &deploy_template
  image: alpine:latest
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

deploy-dev:
  <<: *deploy_template
  script:
    - |
      ssh $SSH_USER@$SSH_HOST "
        cd /home/student/event-planning-dev &&
        sudo chown -R student:student . &&
        git fetch origin --no-recurse-submodules &&
        git checkout develop &&
        git pull --no-recurse-submodules &&
        git submodule update --init --recursive &&
        docker compose -p event-dev up -d --build --remove-orphans
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  dependencies: []

deploy-prod:
  <<: *deploy_template
  script:
    - |
      ssh $SSH_USER@$SSH_HOST "
        cd /home/student/event-planning-prod &&
        sudo chown -R student:student . &&
        git fetch origin --no-recurse-submodules &&
        git checkout master &&
        git pull --no-recurse-submodules &&
        git submodule update --init --recursive &&
        docker compose -p event-prod up -d --build --remove-orphans
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  dependencies: []


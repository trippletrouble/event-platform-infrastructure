services:
  postgres:
    image: postgres:13.5
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d event_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - events
    volumes:
      - postgres:/var/lib/postgresql/data
    profiles:
      - 'db-standalone'
      - ''


  nestjs:
    image: node:22-alpine
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${POSTGRES_URL}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - uploads:/app/uploads
    ports:
      - '${BACKEND_PORT}:3100'
    networks:
      - events
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && rm -f tsconfig.build.tsbuildinfo && npm run start:dev"
    profiles:
      - 'backend-standalone'
      - ''

  prism:
    image: stoplight/prism:4
    command: mock /tmp/swagger.yml --host 0.0.0.0 --port 4010
    volumes:
      - ./backend/docs/swagger.yml:/tmp/swagger.yml
    ports:
      - '4010:4010'
    networks:
      - events
    profiles:
      - 'mock'

  nextjs:
    image: node:22-alpine
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '${FRONTEND_PORT}:3000'
    networks:
      - events
    depends_on:
      - nestjs
    command: sh -c "npm install && npm run dev"
    profiles:
      - 'frontend-standalone'
      - ''

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '9001:9001'
    networks:
      - events
    volumes:
      - minio:/data
    profiles:
      - 'minio-standalone'
      - ''

networks:
  events:
    driver: bridge

volumes:
  uploads:
  postgres:
  minio:
  backend_node_modules:
  frontend_node_modules: